<style>
:root{color-scheme:light;--bg:#F5F7FA;--s1:#FFFFFF;--s2:#DCE6F1;--sb:#FFFFFF;--ln:#C9D6E4;--tx:#26374A;--mu:#5C7088;--pr:#416A8E;--pr2:#35597A;--on:#FFFFFF;--ac:#8FAFCB;--em:#17875B;--am:#A86B00;--co:#C93B3B;--ons:#FFFFFF;--sh:0 1px 3px #26374a14,0 10px 24px -18px #26374a40;--cam1:#3b4f63;--cam2:#1b2532;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151D29;--s1:#243447;--s2:#1D2938;--sb:#1D2938;--ln:#35485B;--tx:#E6EDF4;--mu:#A9B8C8;--pr:#7FA8C9;--pr2:#9BBCD6;--on:#151D29;--ac:#526D82;--em:#4CC38A;--am:#E5B04A;--co:#EF6A6A;--ons:#151D29;--sh:none;--cam1:#2c3d50;--cam2:#111822}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Onest,system-ui,sans-serif;display:flex;min-height:100vh}
body,aside,.card,.btn,.blk,.pill,.bar,.cam,.heat,.sys,.m,input,select,td,.tg{transition:background-color .25s,border-color .25s,color .25s,box-shadow .25s}
.btn{transition:background-color .25s,border-color .25s,color .25s,transform .15s}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside{width:236px;background:var(--sb);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex:none}
aside:before{content:"";height:6px;border-radius:3px;margin-bottom:14px;background:repeating-linear-gradient(135deg,var(--pr) 0 10px,var(--ac) 10px 20px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;padding:0 8px 18px}
.logo b{width:32px;height:32px;border-radius:10px;background:var(--pr);display:grid;place-items:center;color:var(--on)}
.logo b.img{width:46px;height:46px;background:none;box-shadow:none;filter:drop-shadow(0 2px 5px #26374a40)}:root[data-theme="dark"] .logo b.img{filter:drop-shadow(0 0 8px #7fa8c980)}.logo b.img img{width:100%;height:100%;object-fit:contain}
aside a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:500}
aside a:hover{background:var(--s2);color:var(--tx)}aside a.on{background:color-mix(in srgb,var(--pr) 15%,transparent);color:var(--tx);box-shadow:inset 3px 0 var(--pr)}
aside a.on svg{color:var(--pr)}
aside a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.sec{font-size:12px;color:var(--mu);padding:16px 12px 4px}
.sys .dot{display:inline-block;vertical-align:middle}.sys{margin-top:auto;background:var(--s2);border-radius:12px;padding:12px;font-size:12px;color:var(--mu)}
main{flex:1;min-width:0;padding:24px 32px 48px}
header{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--tx)}header p{color:var(--mu)}
.sp{flex:1}.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--s2);border:1px solid var(--ln)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--em);box-shadow:0 0 0 4px color-mix(in srgb,var(--em) 22%,transparent);animation:pl 2s infinite}@keyframes pl{50%{box-shadow:0 0 0 8px transparent}}
.btn{background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--pr)}.btn:active{transform:scale(.97)}.btn.p{background:var(--pr);border:0;color:var(--on)}.btn.p:hover{background:var(--pr2)}
.g{display:grid;gap:16px}.c4{grid-template-columns:repeat(4,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:1.6fr 1fr}.c2e{grid-template-columns:1fr 1fr}.mt{margin-top:16px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--sh)}
.card .card{box-shadow:none}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kpi small{color:var(--mu)}.kpi .v{font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--tx)}.kpi .d{font-size:12px;font-weight:600}
.up{color:var(--em)}.dn{color:var(--co)}.sev-h{color:var(--co)}.sev-m{color:var(--am)}.sev-l{color:var(--em)}
.cam{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/10;background:linear-gradient(160deg,var(--cam1),var(--cam2) 60%),#000;border:1px solid var(--ln)}
.cam:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff08 0 1px,transparent 1px 4px)}
.cam .fl{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(180deg,#52657a40,#0e141c99)}
.cam .box{position:absolute;border:2px solid var(--em);border-radius:4px;font-size:10px;font-weight:700;color:var(--em);box-shadow:0 0 12px currentColor}
.cam .box i{position:absolute;top:-17px;left:-2px;background:var(--em);color:var(--ons);padding:0 5px;font-style:normal;white-space:nowrap}
.cam .box.bad{border-color:var(--co);color:var(--co)}.cam .box.bad i{background:var(--co)}.cam .box.wn{border-color:var(--am);color:var(--am)}.cam .box.wn i{background:var(--am)}
.cam .tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;background:#000a;color:#fff;padding:2px 8px;border-radius:6px}
.cam .rec{position:absolute;top:8px;right:8px;font-size:11px;color:#ff8a8a;font-weight:700}
.cam.th{background:radial-gradient(circle at 60% 55%,#fff 0,#f2c14e 8%,#d9534f 22%,#8e3b46 45%,#2b2233 75%)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:500;font-size:12px;padding:8px 10px}td{padding:11px 10px;border-top:1px solid var(--ln)}
tbody tr{cursor:pointer}tbody tr:hover,tbody tr.on{background:var(--s2)}.scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs button{border-radius:99px}.tabs .btn.on{background:var(--pr);border-color:var(--pr);color:var(--on)}
.bar{height:8px;border-radius:9px;background:var(--s2);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pr),var(--ac))}
.tl{border-left:2px solid var(--ln);padding-left:16px;display:grid;gap:14px}.tl div{position:relative}.tl div:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--pr)}
.tg{width:42px;height:24px;border-radius:99px;background:var(--ac);border:0;position:relative;cursor:pointer;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--em)}.tg.on:after{left:21px}
.row{display:flex;align-items:center;gap:12px}.blk{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.blk b.k{color:var(--pr)}.blk select,.blk input{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 8px;font:inherit}
.chat{display:grid;gap:10px;max-height:380px;overflow:auto;margin-bottom:12px}.m{padding:10px 14px;border-radius:14px;max-width:80%}.m.u{background:var(--pr);color:var(--on);justify-self:end}.m.a{background:var(--s2)}
.in{display:flex;gap:8px}.in input{flex:1;background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit}
.heat{position:relative;aspect-ratio:16/9;border-radius:12px;background:var(--bg);border:1px dashed var(--ac);overflow:hidden}.heat s{position:absolute;border-radius:50%;filter:blur(18px)}.heat u{position:absolute;border:1px solid var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent);border-radius:8px;font-size:11px;padding:2px 8px;text-decoration:none;color:var(--pr)}
@media(prefers-reduced-motion:reduce){.dot{animation:none}*{transition:none!important}}
@media(max-width:1100px){.c4{grid-template-columns:1fr 1fr}.c2,.c3,.c2e{grid-template-columns:1fr}}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto}.sec,.sys,.logo span{display:none}main{padding:18px}.c4{grid-template-columns:1fr}}
