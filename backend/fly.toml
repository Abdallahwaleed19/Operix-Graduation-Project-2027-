# =============================================================================
# Operix Main Backend — Fly.io Production Configuration
# Deploy from repo root: flyctl deploy --config backend/fly.toml backend
# =============================================================================
app = "operix-backend"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  DEBUG = "false"
  HOST = "0.0.0.0"
  PORT = "8080"
  LOG_LEVEL = "INFO"
  LOG_FORMAT = "json"
  EVIDENCE_STORAGE_DIR = "/data/storage/evidence"
  REPORTS_STORAGE_DIR = "/data/storage/reports"
  OPERIX_REPORTS_STORAGE_DIR = "/data/storage/reports"
  LLM_PROVIDER = "openai"
  EMBEDDING_PROVIDER = "openai"
  VECTOR_STORE_TYPE = "numpy_local"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[mounts]
  source = "operix_storage"
  destination = "/data/storage"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
