<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0907;--s1:#17100d;--s2:#231813;--ln:#3a2a20;--tx:#f5f1ec;--mu:#a89d92;--mg:#ff5e0e;--am:#ffbf00;--em:#00e5a0;--co:#ff2e4d;--vi:#9ca3a8;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Onest,system-ui,sans-serif;display:flex;min-height:100vh}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside{width:236px;background:var(--s1);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;padding:0 8px 18px}
.logo b{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--mg),var(--am));display:grid;place-items:center;color:#1a0d00}
aside a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:500}
aside a:hover{background:var(--s2);color:var(--tx)}aside a.on{background:linear-gradient(90deg,#ff5e0e33,#ffbf0014);color:var(--tx);box-shadow:inset 3px 0 var(--mg)}
aside a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--am);outline-offset:2px}
aside:before{content:"";height:6px;border-radius:3px;margin-bottom:14px;background:repeating-linear-gradient(135deg,var(--am) 0 10px,#0d0907 10px 20px)}
.logo b.img{width:46px;height:46px;background:none;box-shadow:none;filter:drop-shadow(0 0 10px #ff5e0eaa)}.logo b.img img{width:100%;height:100%;object-fit:contain}
.sec{font-size:12px;color:var(--mu);padding:16px 12px 4px}
.sys{margin-top:auto;background:var(--s2);border-radius:12px;padding:12px;font-size:12px;color:var(--mu)}
main{flex:1;min-width:0;padding:24px 32px 48px}
header{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}header p{color:var(--mu)}
.sp{flex:1}.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--s2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--em);box-shadow:0 0 0 4px #00e5a033}
.btn{background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:.15s}
.btn:hover{border-color:var(--mg)}.btn:active{transform:scale(.97)}.btn.p{background:linear-gradient(135deg,var(--mg),#ffb300);border:0;color:#fff}
.g{display:grid;gap:16px}.c4{grid-template-columns:repeat(4,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:1.6fr 1fr}.c2e{grid-template-columns:1fr 1fr}.mt{margin-top:16px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kpi small{color:var(--mu)}.kpi .v{font-size:32px;font-weight:700;letter-spacing:-.02em}.kpi .d{font-size:12px;font-weight:600}
.up{color:var(--em)}.dn{color:var(--co)}.sev-h{color:var(--co)}.sev-m{color:var(--am)}.sev-l{color:var(--em)}
.cam{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/10;background:linear-gradient(160deg,#3a2f28,#17130f 60%),#000;border:1px solid var(--ln)}
.cam:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff08 0 1px,transparent 1px 4px)}
.cam .fl{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(180deg,#4a3b3055,#2a211b)}
.cam .box{position:absolute;border:2px solid var(--em);border-radius:4px;font-size:10px;font-weight:700}
.cam .box i{position:absolute;top:-17px;left:-2px;background:var(--em);color:#06201a;padding:0 5px;font-style:normal;white-space:nowrap}
.cam .box.bad{border-color:var(--co)}.cam .box.bad i{background:var(--co);color:#fff}.cam .box.wn{border-color:var(--am)}.cam .box.wn i{background:var(--am);color:#2a1800}
.cam .tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;background:#000a;padding:2px 8px;border-radius:6px}
.cam .rec{position:absolute;top:8px;right:8px;font-size:11px;color:var(--co);font-weight:700}
.cam.th{background:radial-gradient(circle at 60% 55%,#fff 0,#ffd23f 8%,#ff2e4d 22%,#c2410c 45%,#2a120a 75%)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:500;font-size:12px;padding:8px 10px}td{padding:11px 10px;border-top:1px solid var(--ln)}
tbody tr{cursor:pointer}tbody tr:hover,tbody tr.on{background:var(--s2)}.scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs button{border-radius:99px}.tabs .btn.on{background:var(--mg);border-color:var(--mg)}
.bar{height:8px;border-radius:9px;background:var(--s2);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--mg),var(--am))}
.tl{border-left:2px solid var(--ln);padding-left:16px;display:grid;gap:14px}.tl div{position:relative}.tl div:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--mg)}
.tg{width:42px;height:24px;border-radius:99px;background:var(--ln);border:0;position:relative;cursor:pointer;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--em)}.tg.on:after{left:21px}
.row{display:flex;align-items:center;gap:12px}.blk{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.blk b.k{color:var(--am)}.blk select,.blk input{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 8px;font:inherit}
.chat{display:grid;gap:10px;max-height:380px;overflow:auto;margin-bottom:12px}.m{padding:10px 14px;border-radius:14px;max-width:80%}.m.u{background:var(--mg);justify-self:end}.m.a{background:var(--s2)}
.in{display:flex;gap:8px}.in input{flex:1;background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit}
.heat{position:relative;aspect-ratio:16/9;border-radius:12px;background:#0e0b09;border:1px dashed var(--ln);overflow:hidden}.heat s{position:absolute;border-radius:50%;filter:blur(18px)}.heat u{position:absolute;border:1px solid var(--vi);background:#9ca3a81a;border-radius:8px;font-size:11px;padding:2px 8px;text-decoration:none;color:var(--vi)}
body{background:radial-gradient(900px 520px at 88% -8%,#ff5e0e3d,transparent 62%),radial-gradient(760px 520px at -5% 105%,#ff2e4d2e,transparent 60%),radial-gradient(500px 380px at 55% 110%,#ffbf0018,transparent 65%),var(--bg);background-attachment:fixed}
aside{background:linear-gradient(180deg,#1d110b,#0e0806)}
.card{border:1px solid transparent;background:linear-gradient(160deg,#1f130e,#150d0a) padding-box,linear-gradient(135deg,#ff5e0e99,#3a2a20 38%,#3a2a20 62%,#ffbf0088) border-box;box-shadow:0 18px 50px -28px #ff5e0e99}

h1,.kpi .v{background:linear-gradient(90deg,#fff 0,#ffd98a 45%,#ff8a3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn.p{background:linear-gradient(135deg,#ff2e4d,#ff6a13 55%,#ffbf00);box-shadow:0 10px 30px -8px #ff5e0eb3}

.logo b{box-shadow:0 0 24px #ff5e0eaa;background:linear-gradient(135deg,#ff2e4d,#ff6a13 50%,#ffbf00)}
.dot{animation:pl 2s infinite}@keyframes pl{50%{box-shadow:0 0 0 8px #00e5a000}}

.bar i{background:linear-gradient(90deg,#ff2e4d,#ff6a13,#ffbf00);box-shadow:0 0 12px #ff5e0e99}
.m.u{background:linear-gradient(135deg,#ff2e4d,#ff6a13)}
.blk{background:linear-gradient(90deg,#2a1810,#1c110c)}.tl div:before{background:#ffbf00;box-shadow:0 0 10px #ffbf00}
.tg.on{background:linear-gradient(90deg,#00e5a0,#7dffd0);box-shadow:0 0 14px #00e5a099}
.tabs .btn.on{background:linear-gradient(135deg,#ff2e4d,#ff6a13);box-shadow:0 6px 20px -6px #ff5e0e}
.pill{background:#ff5e0e22;border:1px solid #ff5e0e55}
