name: Operix CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: operix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: "ci-test-secret-key-at-least-32-bytes-long"
      WS_TICKET_KEY: "ci-test-ws-ticket-key-at-least-32-bytes"
      REDIS_URL: "redis://localhost:6379/0"
      DATABASE_URL: "sqlite:///./ci_test.db"
      OPERIX_REJECT_PRODUCTION_DB: "1"
      PYTHONPATH: "${{ github.workspace }}/backend:${{ github.workspace }}/backend/ai-services"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/ai-services/requirements.txt
            backend/ai-services/llm_rag_assistant/requirements.txt

      - name: Install backend & AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ai-services/requirements.txt
          pip install -r ai-services/llm_rag_assistant/requirements.txt
          pip install openpyxl reportlab

      - name: Python syntax check
        run: python -m compileall -q app

      - name: Run pytest suite
        run: pytest -q

  frontend-build:
    name: Frontend Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build check
        env:
          VITE_USE_MOCK_DATA: "false"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://operix-backend.fly.dev' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'wss://operix-backend.fly.dev' }}
        run: npm run build

  deploy-backend:
    name: Deploy Backend to Fly.io
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_FLY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend container to Fly.io
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Verify production health endpoint
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://operix-backend.fly.dev/health; then
              echo "Health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed!"
          exit 1
