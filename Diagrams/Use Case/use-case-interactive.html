<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Use Case Diagram</title>
<style>
:root{--bg:#f1f3f5;--pn:#fff;--tx:#212529;--mu:#868e96;--bd:#dee2e6;--ac:#1971c2}
@media(prefers-color-scheme:dark){:root{--bg:#1a1b1e;--pn:#25262b;--tx:#e9ecef;--mu:#909296;--bd:#373a40;--ac:#74c0fc}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13px/1.4 system-ui,Segoe UI,sans-serif;color:var(--tx);background:var(--bg)}
#app{display:grid;grid-template:auto 1fr/1fr 330px;height:100%;background:var(--bg)}
#tb{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--bd)}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#tb .sp{flex:1}#zl{color:var(--mu);min-width:44px;text-align:right}
#cv{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#fff}#cv.drag{cursor:grabbing}
#cv svg{width:100%;height:100%;display:block;user-select:none}
#side{background:var(--pn);border-left:1px solid var(--bd);overflow:auto;padding:12px}
h3{margin:0 0 8px;font-size:15px}h4{margin:14px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);font-size:11px;margin-right:4px}
.lk{display:block;width:100%;text-align:left;margin:3px 0;padding:5px 8px;font-size:12px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 8px}.kv b{color:var(--mu);font-weight:500}.none{color:var(--mu);font-style:italic}
#nav{border-bottom:1px solid var(--bd);padding-bottom:8px;margin-bottom:10px}
#nav button{display:block;width:100%;text-align:left;margin:3px 0;font-size:12px}
#lg{border-top:1px solid var(--bd);margin-top:16px;padding-top:8px;font-size:11px}
#lg div{display:flex;align-items:center;gap:6px;margin:2px 0}#lg i{display:inline-block;width:16px;height:12px;border-radius:3px;border:2px solid;flex:none}
#tip{position:fixed;z-index:9;pointer-events:none;background:#212529;color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;max-width:300px;display:none;box-shadow:0 2px 8px #0005}
#tip b{display:block}#tip span{color:#adb5bd}
#cv [data-item-id],#cv [data-transition-id]{cursor:pointer;transition:opacity .15s}
#cv .interactive-hit{fill:none}
#cv.has [data-item-id],#cv.has [data-transition-id]{opacity:.14}
#cv.has .hl,#cv.has .hov{opacity:1}
#cv .gone{display:none}
/* states */
#cv [data-item-kind=usecase].hov>path:nth-child(1){fill:#d0ebff!important}
#cv [data-item-kind].hov>path:nth-child(2),#cv [data-item-kind=package].hov>path{stroke:#0b7285!important;stroke-width:3.5!important}
#cv [data-item-kind=usecase].nb>path:nth-child(1){fill:#f3f0ff!important}
#cv [data-item-kind].nb>path:nth-child(2),#cv [data-item-kind=package].nb>path{stroke:#7048e8!important;stroke-width:3.5!important}
#cv [data-item-kind=usecase].sel>path:nth-child(1){fill:#fff0d6!important}
#cv [data-item-kind].sel>path:nth-child(2),#cv [data-item-kind=package].sel>path{stroke:#d9480f!important;stroke-width:4!important}
#cv [data-item-kind].sel:not(:has(>text)),#cv .tsel{filter:drop-shadow(0 0 5px #fd7e14aa)}
#cv [data-item-kind=initial].sel circle,#cv [data-item-kind=final].sel circle,#cv [data-item-kind=initial].nb circle,#cv [data-item-kind=final].nb circle,#cv [data-item-kind=initial].hov circle,#cv [data-item-kind=final].hov circle{stroke:#d9480f!important;stroke-width:3!important}
#cv [data-item-kind=system].hov>path,#cv [data-item-kind=system].sel>path,#cv [data-item-kind=system].nb>path{stroke:#d9480f!important;stroke-width:4!important}
#cv [data-item-kind=system]>path{pointer-events:stroke}
#cv [data-item-kind=actor].hov path:not([stroke="none"]){stroke:#0b7285!important;stroke-width:3.5!important}
#cv [data-item-kind=actor].nb path:not([stroke="none"]){stroke:#7048e8!important;stroke-width:3.5!important}
#cv [data-item-kind=actor].sel path:not([stroke="none"]){stroke:#d9480f!important;stroke-width:3.5!important}
/* transitions */
#cv g[data-transition-id]>g:not(.transition-hit)>path{transition:stroke .1s}
#cv .t-hov>g:not(.transition-hit)>path{stroke:#0b7285!important;stroke-width:3.5!important}
#cv .t-in>g:not(.transition-hit)>path{stroke:#2b8a3e!important;stroke-width:3.5!important}
#cv .t-out>g:not(.transition-hit)>path{stroke:#1971c2!important;stroke-width:3.5!important}
#cv .tsel>g:not(.transition-hit)>path{stroke:#d9480f!important;stroke-width:4!important}
#cv .t-hov text,#cv .t-in text,#cv .t-out text,#cv .tsel text{font-weight:700}
#cv .t-in text{fill:#2b8a3e}#cv .t-out text{fill:#1971c2}#cv .tsel text{fill:#d9480f}#cv .t-hov text{fill:#0b7285}
#cv [data-section-frame]{cursor:pointer}
@media(max-width:800px){#app{grid-template:auto 1fr 220px/1fr}#side{border-left:0;border-top:1px solid var(--bd)}}
</style></head><body>
<div id="app">
<div id="tb">
<button id="bzi" title="Zoom in (+)">＋ Zoom In</button><button id="bzo" title="Zoom out (-)">－ Zoom Out</button><span id="zl"></span>
<button id="bfa" title="Fit All (F)">Fit All</button><button id="bfs">Fit Selected Section</button><button id="brs" title="Reset (0)">Reset View</button>
<button id="bfu">Fullscreen</button><button id="bcl" title="Esc">Clear Selection</button><button id="bco">Collapse Subsystems</button>
<span class="sp"></span><span style="color:var(--mu)">Wheel = zoom · drag = pan · click = select</span></div>

 if(moved){V.x=drag.vx-dx/V.k;V.y=drag.vy-dy/V.k;apply()}});
cv.addEventListener('pointerup',e=>{drag=null;cv.classList.remove('drag')});
new ResizeObserver(apply).observe(cv);
/* ---------- selection ---------- */
let sel=null,secFocus=null,hov=null;const colp=new Set();
const clsAll=c=>$$('.'+c).forEach(e=>e.classList.remove(c));
const UC=Object.values(S).filter(s=>s.type==='usecase'),PK=Object.values(S).filter(s=>s.type==='package');
const hidIds=()=>new Set(UC.filter(u=>colp.has(u.parent)).map(u=>u.id));
const hidT=()=>{const h=hidIds();return new Set(D.transitions.filter(t=>h.has(t.from)||h.has(t.to)).map(t=>t.id))};
const actSecs={};D.transitions.forEach(t=>{if(S[t.from].type==='actor')(actSecs[t.from]??=new Set()).add(S[t.to].section)});
function pkgHl(id){const mem=new Set(UC.filter(u=>u.parent===id).map(u=>u.id));
 byItem(id).forEach(e=>e.classList.add('hl','sel'));
 mem.forEach(m=>byItem(m).forEach(e=>e.classList.add('hl','nb')));
 D.transitions.forEach(t=>{if(mem.has(t.from)||mem.has(t.to)){byTr(t.id).forEach(e=>e.classList.add('hl','t-out'));[t.from,t.to].forEach(i=>{if(S[i].type==='actor')byItem(i).forEach(e=>e.classList.add('hl','nb'))})}})}
function render(){
 ['hl','sel','nb','tsel','t-in','t-out','t-hov','hov'].forEach(clsAll);
 let any=false;
 const hlS=id=>byItem(id).forEach(e=>e.classList.add('hl')),hlT=id=>byTr(id).forEach(e=>e.classList.add('hl'));
 if(sel&&sel.type==='state'&&S[sel.id].type==='package'){any=true;pkgHl(sel.id)}
 else if(sel&&sel.type==='state'){any=true;const id=sel.id;hlS(id);byItem(id).forEach(e=>e.classList.add('sel'));
  IN[id].forEach(t=>{hlT(t.id);byTr(t.id).forEach(e=>e.classList.add('t-in'));hlS(t.from);byItem(t.from).forEach(e=>e.classList.add('nb'))});
  OUT[id].forEach(t=>{hlT(t.id);byTr(t.id).forEach(e=>e.classList.add('t-out'));hlS(t.to);byItem(t.to).forEach(e=>e.classList.add('nb'))});
  byItem(id).forEach(e=>e.classList.remove('nb'));
 }else if(sel&&sel.type==='transition'){any=true;const t=T[sel.id];hlT(t.id);byTr(t.id).forEach(e=>e.classList.add('tsel'));
  [t.from,t.to].forEach(i=>{hlS(i);byItem(i).forEach(e=>e.classList.add('sel'))})}
 else if(secFocus){any=true;Object.values(S).filter(s=>inSec(s,secFocus)).forEach(s=>hlS(s.id));
  D.transitions.filter(t=>inSec(S[t.from],secFocus)&&inSec(S[t.to],secFocus)).forEach(t=>hlT(t.id))}
 cv.classList.toggle('has',any);
 document.querySelectorAll('#nav button[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===(secFocus||(sel&&sel.type==='section'&&sel.id))));
 $('#bco').textContent=(colp.size?'Expand':'Collapse')+' Subsystems';
 $('#bco').classList.toggle('on',colp.size>0);
 panel();
}
const inSec=(s,id)=>id==='all'||(id==='platform'?s.type!=='actor':s.type==='actor'?!!(actSecs[s.id]&&actSecs[s.id].has(id)):s.section===id);
function select(o){sel=o;secFocus=o&&o.type==='section'?o.id:null;if(secFocus==='all')secFocus=null;render()}
function clearSel(){sel=null;secFocus=null;render()}
function curSection(){if(sel){if(sel.type==='section')return sel.id;const s=sel.type==='state'?S[sel.id]:S[T[sel.id].to];return s.type==='actor'?'platform':s.section==='platform'?'platform':s.section}return 'all'}
/* ---------- details panel ---------- */
function trBtn(t,dir){const o=dir==='in'?t.from:t.to;return `<button class="lk" data-t="${t.id}">${dir==='in'?esc(nm(o))+' →':'→ '+esc(nm(o))}<br><span class="none" style="font-style:normal">${esc(tlabel(t))}</span></button>`}
function grp(t,l,dir){return `<h4>${t} (${l.length})</h4>`+(l.map(x=>trBtn(x,dir)).join('')||'<div class="none">None</div>')}
function panel(){let h='';
 if(sel&&sel.type==='state'){const s=S[sel.id],p=s.parent&&S[s.parent];
  h=`<h3>${esc(s.name)}</h3><span class="badge">${TYPE[s.type]}</span>${p?`<span class="badge">${esc(p.name)}</span>`:''}
  <h4>Details</h4><div class="kv"><b>Type</b><span>${TYPE[s.type]}</span><b>${s.type==='usecase'?'Subsystem':'Parent'}</b><span>${p?`<a href="#" data-s="${p.id}">${esc(p.name)}</a>`:'<span class="none">top level</span>'}</span><b>ID</b><span><code>${s.id}</code></span></div>`;
  const I=IN[s.id],O=OUT[s.id],st=x=>x.stereo,hasA=(x)=>S[x.from].type==='actor';
  if(s.type==='actor')h+=grp('Associated use cases',O,'out');
  else if(s.type==='usecase'){h+=grp('Actors',I.filter(hasA),'in')+grp('Includes',O.filter(x=>x.stereo==='include'),'out')+grp('Included by',I.filter(x=>x.stereo==='include'),'in')+grp('Extends',O.filter(x=>x.stereo==='extend'),'out')+grp('Extended by',I.filter(x=>x.stereo==='extend'),'in')}
  else if(s.type==='package'){const u=UC.filter(x=>x.parent===s.id),a=Object.values(S).filter(x=>x.type==='actor'&&actSecs[x.id]&&actSecs[x.id].has(s.id));
   h+=`<h4>Use cases (${u.length})</h4>`+u.map(x=>`<button class="lk" data-s="${x.id}">${esc(x.name)}</button>`).join('')+`<h4>Actors (${a.length})</h4>`+a.map(x=>`<button class="lk" data-s="${x.id}">${esc(x.name)}</button>`).join('')+
   `<h4>View</h4><button class="lk" data-fit="${s.id}">Fit to this subsystem</button><button class="lk" data-act="collapse" data-pk="${s.id}">${colp.has(s.id)?'Expand':'Collapse'} this subsystem</button>`}
  else if(s.type==='system'){h+=`<h4>Subsystems</h4>`+PK.map(x=>`<button class="lk" data-s="${x.id}">${esc(x.name)}</button>`).join('')+`<button class="lk" data-fit="platform">Fit to platform</button>`}
 }else if(sel&&sel.type==='transition'){const t=T[sel.id],k=t.stereo||'association';
  h=`<h3>${esc(tlabel(t))}</h3><span class="badge">${k==='association'?'Association':k[0].toUpperCase()+k.slice(1)+' relationship'}</span><div class="kv" style="margin-top:10px">
  <b>Source</b><span><a href="#" data-s="${t.from}">${esc(nm(t.from))}</a> <span class="none">(${TYPE[S[t.from].type]})</span></span><b>Destination</b><span><a href="#" data-s="${t.to}">${esc(nm(t.to))}</a> <span class="none">(${TYPE[S[t.to].type]})</span></span>
  <b>Stereotype</b><span>${t.stereo?'«'+esc(t.stereo)+'»':'<span class="none">none (plain association)</span>'}</span><b>Meaning</b><span>${MEAN[k]}</span>
  <b>Subsystem</b><span><a href="#" data-s="${t.section}">${esc(S[t.section]?S[t.section].name:'')}</a></span><b>ID</b><span><code>${t.id}</code></span></div>`;
 }else{const id=secFocus||'all',sc=SEC[id],ss=Object.values(S).filter(s=>s.type!=='system'&&s.type!=='package'&&inSec(s,id)),ts=D.transitions.filter(t=>inSec(S[t.from],id)&&inSec(S[t.to],id));
  h=`<h3>${esc(sc.name)}</h3><span class="badge">${id==='all'?'overview':'section'}</span><div class="kv" style="margin-top:10px"><b>Actors</b><span>${ss.filter(s=>s.type==='actor').length}</span><b>Use cases</b><span>${ss.filter(s=>s.type==='usecase').length}</span><b>Relationships</b><span>${ts.length}</span></div>`;
  if(id==='all')h+=`<h4>Sections</h4>`+D.sections.slice(1).map(s=>`<button class="lk" data-sec="${s.id}">${esc(s.name)}</button>`).join('')+`<p class="none">Click an actor, use case, subsystem or connector to inspect it. Click empty canvas to clear.</p>`;
  else h+=`<h4>Elements</h4>`+ss.map(s=>`<button class="lk" data-s="${s.id}">${esc(nm(s.id))} <span class="none">· ${TYPE[s.type]}</span></button>`).join('')+`<button class="lk" data-sec="all">← Back to complete diagram</button>`}
 side.innerHTML=h}
document.getElementById('side').addEventListener('click',e=>{e.preventDefault();const b=e.target.closest('[data-s],[data-t],[data-sec],[data-act],[data-fit]');if(!b)return;
 if(b.dataset.s){select({type:'state',id:b.dataset.s});}
 else if(b.dataset.t)select({type:'transition',id:b.dataset.t});
 else if(b.dataset.sec){const id=b.dataset.sec;select(id==='all'?null:{type:'section',id});fitBox(id)}
 else if(b.dataset.fit)fitBox(b.dataset.fit);
 else if(b.dataset.act)toggleCollapse(b.dataset.pk)});
/* ---------- hover + click on diagram ---------- */
function target(el){const t=el.closest('[data-transition-id]'),i=el.closest('[data-item-id]'),f=el.closest('[data-section-frame]');
 if(t&&svg.contains(t))return{type:'transition',id:t.dataset.transitionId};if(i&&svg.contains(i))return{type:'state',id:i.dataset.itemId};
 if(f)return{type:'section',id:f.dataset.sectionId};return null}
function setHover(o){clsAll('hov');clsAll('t-hov');if(!o)return;
 if(o.type==='state')byItem(o.id).forEach(e=>e.classList.add('hov'));
 else if(o.type==='transition')byTr(o.id).forEach(e=>e.classList.add('hov','t-hov'))}
function tipHtml(o){if(o.type==='state'){const s=S[o.id],p=s.parent&&S[s.parent];return `<b>${esc(s.name)}</b><span>${TYPE[s.type]}${p?' · '+esc(p.name):''}<br>${IN[s.id].length} incoming · ${OUT[s.id].length} outgoing relationship(s)</span>`}
 if(o.type==='transition'){const t=T[o.id];return `<b>${esc(tlabel(t))}</b><span>${esc(nm(t.from))}<br>→ ${esc(nm(t.to))}</span>`}
 return `<b>${esc(SEC[o.id].name)}</b><span>Click to focus this section</span>`}
svg.addEventListener('pointermove',e=>{if(drag&&moved)return;const o=target(e.target);const k=o&&o.type+o.id;
 if(k!==hov){hov=k;setHover(o&&o.type!=='section'?o:null)}
 if(o){tip.innerHTML=tipHtml(o);tip.style.display='block';const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.min(e.clientY+16,innerHeight-tip.offsetHeight-8);tip.style.left=x+'px';tip.style.top=y+'px'}else tip.style.display='none'});
svg.addEventListener('pointerleave',()=>{hov=null;setHover(null);tip.style.display='none'});
svg.addEventListener('click',e=>{if(moved){moved=false;return}const o=target(e.target);if(!o)return clearSel();
 select(o);if(o.type==='section')fitBox(o.id);e.stopPropagation()});
svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const o=target(e.target);if(o){e.preventDefault();select(o)}}});
/* ---------- collapse nested ---------- */
function toggleCollapse(pk){if(pk)colp.has(pk)?colp.delete(pk):colp.add(pk);else if(colp.size)colp.clear();else PK.forEach(p=>colp.add(p.id));
 $$('.gone').forEach(e=>e.classList.remove('gone'));const hi=hidIds(),ht=hidT();
 hi.forEach(i=>byItem(i).forEach(e=>e.classList.add('gone')));ht.forEach(i=>byTr(i).forEach(e=>e.classList.add('gone')));
 if(sel&&((sel.type==='state'&&hi.has(sel.id))||(sel.type==='transition'&&ht.has(sel.id))))sel=null;render()}
/* ---------- toolbar ---------- */
$('#bzi').onclick=()=>zoomAt(1.3,undefined,undefined,200);$('#bzo').onclick=()=>zoomAt(1/1.3,undefined,undefined,200);
$('#bfa').onclick=fitAll;$('#bfs').onclick=()=>fitBox(curSection());
$('#brs').onclick=()=>go({k:1,x:0,y:0});$('#bcl').onclick=clearSel;$('#bco').onclick=()=>toggleCollapse();
$('#bfu').onclick=()=>{const a=$('#app');document.fullscreenElement?document.exitFullscreen():(a.requestFullscreen||a.webkitRequestFullscreen||(()=>{})).call(a)};
document.addEventListener('fullscreenchange',()=>{$('#bfu').textContent=document.fullscreenElement?'Exit Fullscreen':'Fullscreen';$('#bfu').classList.toggle('on',!!document.fullscreenElement)});
if(!document.documentElement.requestFullscreen&&!document.documentElement.webkitRequestFullscreen)$('#bfu').disabled=true;
addEventListener('keydown',e=>{if(e.key==='Escape')clearSel();else if(e.key==='+'||e.key==='=')zoomAt(1.3,0,0,0)||$('#bzi').click();else if(e.key==='-')$('#bzo').click();else if(e.key==='0')$('#brs').click();else if(e.key==='f'||e.key==='F')fitAll()});
const nav=$('#nav');D.sections.forEach(s=>{const b=document.createElement('button');b.textContent=s.name;b.dataset.nav=s.id;b.onclick=()=>{select(s.id==='all'?null:{type:'section',id:s.id});fitBox(s.id)};nav.appendChild(b)});

window.__sm={V:()=>V,S,T,sel:()=>sel};
requestAnimationFrame(()=>{fitAll();render()});
})();
</script></body></html>
